<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Ghar Ka Khana Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

h1,h2{
color:#8b0000;
}

.card{
background:white;
padding:18px;
margin:15px 0;
border-radius:12px;
box-shadow:0 2px 8px #ddd;
}

input,select,textarea{
width:100%;
padding:12px;
margin:6px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

button{
padding:10px 14px;
border:0;
border-radius:8px;
background:#8b0000;
color:white;
font-weight:bold;
margin:4px;
}

.green{
background:green;
}

.gray{
background:#555;
}

.order{
border:1px solid #ddd;
padding:15px;
border-radius:10px;
margin:12px 0;
}

.order-items{
background:#fff8f0;
padding:12px;
border-radius:8px;
margin:12px 0;
}

.menu-item{
border-bottom:1px solid #ddd;
padding:13px 0;
}

.hidden{
display:none;
}

.login-box{
max-width:450px;
margin:50px auto;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

</style>

</head>

<body>


<!-- =========================
     LOGIN
========================= -->

<div id="loginPage" class="login-box card">

<h1>🍲 Ghar Ka Khana</h1>

<h2>Admin Login</h2>

<input
id="email"
type="email"
placeholder="Admin Email"
>

<input
id="password"
type="password"
placeholder="Password"
>

<button
onclick="login()"
style="width:100%;font-size:17px"
>
🔐 Login
</button>

<p id="loginMessage"></p>

</div>


<!-- =========================
     ADMIN
========================= -->

<div id="adminPage" class="hidden">

<div class="topbar">

<h1>🍲 Ghar Ka Khana</h1>

<button
class="gray"
onclick="logout()"
>
Logout
</button>

</div>


<!-- ORDERS -->

<div class="card">

<h2>📦 Orders</h2>

<button onclick="loadOrders()">
🔄 Refresh Orders
</button>

<div id="orders">
Loading...
</div>

</div>


<!-- MENU -->

<div class="card">

<h2>🍽️ Menu Editor</h2>

<button onclick="showAddForm()">
➕ Add New Item
</button>


<div
id="addForm"
class="hidden"
>

<input
id="newName"
placeholder="Item Name"
>

<input
id="newPrice"
type="number"
placeholder="Price"
>

<input
id="newCategory"
placeholder="Category"
>

<textarea
id="newDescription"
placeholder="Description"
></textarea>

<button onclick="addItem()">
Save Item
</button>

</div>


<div id="menuList">
Loading menu...
</div>

</div>

</div>


<script>


const SUPABASE_URL =
"https://oxfuccrgitckvozmnyss.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DwZtFpmfTwDnlAp6fYbjpA_upTa3khj";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


// =================================
// CHECK LOGIN
// =================================

async function checkLogin(){

const {
data:{
session
}
}=await supabaseClient.auth.getSession();

if(session){

await checkAdmin(session.user.id);

}else{

showLogin();

}

}


// =================================
// ADMIN CHECK
// =================================

async function checkAdmin(userId){

const {data,error}=await supabaseClient
.from("profiles")
.select("role,name")
.eq("id",userId)
.single();

if(error || !data || data.role!=="admin"){

await supabaseClient.auth.signOut();

document.getElementById("loginMessage").innerText=
"This account is not an admin.";

showLogin();

return;

}

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("adminPage")
.classList.remove("hidden");

loadOrders();
loadMenu();

}


// =================================
// LOGIN
// =================================

async function login(){

const email=
document.getElementById("email")
.value.trim();

const password=
document.getElementById("password")
.value;


if(!email || !password){

document.getElementById("loginMessage")
.innerText="Please enter email and password.";

return;

}


const {data,error}=
await supabaseClient.auth.signInWithPassword({

email:email,
password:password

});


if(error){

document.getElementById("loginMessage")
.innerText=error.message;

return;

}


await checkAdmin(data.user.id);

}


// =================================
// LOGOUT
// =================================

async function logout(){

await supabaseClient.auth.signOut();

showLogin();

}


function showLogin(){

document.getElementById("loginPage")
.classList.remove("hidden");

document.getElementById("adminPage")
.classList.add("hidden");

}


// =================================
// ORDERS
// =================================

async function loadOrders(){

const box=
document.getElementById("orders");

box.innerHTML="Loading orders...";


const {data:orders,error}=await supabaseClient
.from("orders")
.select("*")
.order("created_at",{ascending:false});


if(error){

box.innerHTML=
"Error: "+error.message;

return;

}


if(!orders || orders.length===0){

box.innerHTML=
"No orders yet.";

return;

}


box.innerHTML="";


for(const order of orders){


const {data:items}=await supabaseClient
.from("order_items")
.select("*")
.eq("order_id",order.id);


let itemsHTML="";


if(items && items.length){

items.forEach(item=>{

itemsHTML+=`

<div style="padding:5px 0">

<b>${item.item_name}</b>

× ${item.quantity}

&nbsp; — &nbsp;

₹${item.price}

</div>

`;

});

}else{

itemsHTML=
"No item details found.";

}


const date=
new Date(order.created_at)
.toLocaleString("en-IN");


const div=
document.createElement("div");

div.className="order";


div.innerHTML=`

<h3>🧾 Order #${order.id}</h3>

<b>👤 Customer:</b>
${order.customer_name}

<br>

<b>📞 Phone:</b>
${order.customer_phone}

<br>

<b>📍 Address:</b>
${order.delivery_address}

<br>

<b>🕐 Order Time:</b>
${date}

<br>

<b>💰 Total:</b>
₹${order.total_amount}

<br>

<b>💵 Payment:</b>
Cash on Delivery

<br>

<div class="order-items">

<b>🍽️ Order Details</b>

<hr>

${itemsHTML}

</div>


<label>
<b>Status</b>
</label>


<select
onchange="updateStatus(${order.id},this.value)"
>

<option value="pending"
${order.status==="pending"?"selected":""}
>
Pending
</option>

<option value="preparing"
${order.status==="preparing"?"selected":""}
>
Preparing
</option>

<option value="ready"
${order.status==="ready"?"selected":""}
>
Ready
</option>

<option value="out_for_delivery"
${order.status==="out_for_delivery"?"selected":""}
>
Out for Delivery
</option>

<option value="delivered"
${order.status==="delivered"?"selected":""}
>
Delivered
</option>

<option value="cancelled"
${order.status==="cancelled"?"selected":""}
>
Cancelled
</option>

</select>


<br>


<a href="tel:${order.customer_phone}">

<button>
📞 Call Customer
</button>

</a>


<button
onclick="navigate('${encodeURIComponent(order.delivery_address)}')"
>
🗺️ Navigate
</button>


<button
class="green"
onclick="markDelivered(${order.id})"
>
✅ Mark Delivered
</button>

`;


box.appendChild(div);

}

}


// =================================
// UPDATE ORDER STATUS
// =================================

async function updateStatus(id,status){

const {error}=await supabaseClient
.from("orders")
.update({
status:status
})
.eq("id",id);


if(error){

alert(error.message);

return;

}


loadOrders();

}


// =================================
// MARK DELIVERED
// =================================

async function markDelivered(id){

await updateStatus(
id,
"delivered"
);

}


// =================================
// GOOGLE MAPS
// =================================

function navigate(address){

window.open(
"https://www.google.com/maps/search/?api=1&query="+address,
"_blank"
);

}


// =================================
// MENU
// =================================

async function loadMenu(){

const box=
document.getElementById("menuList");

box.innerHTML=
"Loading menu...";


const {data,error}=
await supabaseClient
.from("menu_items")
.select("*")
.order("category")
.order("name");


if(error){

box.innerHTML=
"Menu error: "+error.message;

return;

}


box.innerHTML="";


data.forEach(item=>{

const div=
document.createElement("div");

div.className="menu-item";


div.innerHTML=`

<b>${item.name}</b>

<br>

₹${item.price}

<br>

Category:
${item.category}

<br>

Description:
${item.description || "-"}

<br>

Status:
${item.is_available
?"✅ Available"
:"❌ Hidden"}

<br>


<button
onclick="editItem(${item.id})"
>
✏️ Edit
</button>


<button
class="gray"
onclick="toggleItem(${item.id},${item.is_available})"
>
${item.is_available
?"Hide"
:"Show"}
</button>


<button
class="gray"
onclick="deleteItem(${item.id})"
>
🗑️ Delete
</button>

`;

box.appendChild(div);

});

}


// =================================
// ADD MENU ITEM
// =================================

function showAddForm(){

document.getElementById("addForm")
.classList.remove("hidden");

}


async function addItem(){

const name=
document.getElementById("newName")
.value.trim();

const price=
Number(
document.getElementById("newPrice")
.value
);

const category=
document.getElementById("newCategory")
.value.trim()
||"Main Course";

const description=
document.getElementById("newDescription")
.value.trim();


if(!name || !price){

alert(
"Name and price required."
);

return;

}


const {error}=
await supabaseClient
.from("menu_items")
.insert({

name:name,
price:price,
category:category,
description:description,
is_available:true

});


if(error){

alert(error.message);

return;

}


document.getElementById("newName").value="";
document.getElementById("newPrice").value="";
document.getElementById("newCategory").value="";
document.getElementById("newDescription").value="";


document.getElementById("addForm")
.classList.add("hidden");


loadMenu();

}


// =================================
// EDIT MENU
// =================================

async function editItem(id){

const name=
prompt("Item name:");

if(name===null)return;


const price=
prompt("Price:");

if(price===null)return;


const category=
prompt("Category:");

if(category===null)return;


const description=
prompt("Description:");

if(description===null)return;


const {error}=
await supabaseClient
.from("menu_items")
.update({

name:name,
price:Number(price),
category:category,
description:description

})
.eq("id",id);


if(error){

alert(error.message);

return;

}


loadMenu();

}


// =================================
// HIDE / SHOW
// =================================

async function toggleItem(id,current){

const {error}=
await supabaseClient
.from("menu_items")
.update({

is_available:!current

})
.eq("id",id);


if(error){

alert(error.message);

return;

}


loadMenu();

}


// =================================
// DELETE
// =================================

async function deleteItem(id){

if(!confirm(
"Delete this menu item?"
))return;


const {error}=
await supabaseClient
.from("menu_items")
.delete()
.eq("id",id);


if(error){

alert(error.message);

return;

}


loadMenu();

}


// =================================
// START
// =================================

checkLogin();

</script>

</body>
</html>
