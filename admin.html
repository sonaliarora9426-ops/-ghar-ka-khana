<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<title>Ghar Ka Khana - Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#fff8f0;
  color:#222;
  padding-bottom:30px;
}

header{
  background:#f47b20;
  color:white;
  text-align:center;
  padding:25px 15px;
}

header h1{
  font-size:28px;
}

header p{
  margin-top:6px;
  font-size:14px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.box{
  background:white;
  margin-top:18px;
  padding:20px;
  border-radius:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h2{
  margin-bottom:15px;
}

.order{
  border:1px solid #eee;
  border-radius:14px;
  padding:15px;
  margin-top:12px;
}

.order-id{
  font-size:18px;
  font-weight:bold;
  color:#f47b20;
}

.customer{
  margin-top:10px;
  line-height:1.7;
}

.amount{
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
}

.status{
  display:inline-block;
  margin-top:10px;
  padding:6px 10px;
  border-radius:20px;
  background:#fff0e5;
  color:#f47b20;
  font-size:13px;
  font-weight:bold;
}

select{
  width:100%;
  padding:12px;
  margin-top:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  background:white;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.action-btn{
  display:block;
  text-align:center;
  text-decoration:none;
  padding:12px 8px;
  border-radius:10px;
  background:#f47b20;
  color:white;
  font-size:14px;
  font-weight:bold;
}

.delivered{
  background:#238636;
  color:white;
  border:0;
  width:100%;
  padding:13px;
  margin-top:10px;
  border-radius:10px;
  font-size:15px;
  font-weight:bold;
}

.refresh{
  width:100%;
  padding:13px;
  margin-top:12px;
  border:0;
  border-radius:10px;
  background:#333;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.empty{
  color:#777;
  text-align:center;
  padding:20px 5px;
}

.loading{
  text-align:center;
  padding:20px;
  color:#777;
}

.error{
  background:#ffe8e8;
  color:#b00020;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
  font-size:14px;
}

.delivery-note{
  background:#fff4e8;
  border-radius:12px;
  padding:12px;
  margin-bottom:15px;
  font-size:14px;
  line-height:1.5;
}
</style>
</head>

<body>

<header>
  <h1>👑 Ghar Ka Khana</h1>
  <p>Admin Panel • Self Delivery</p>
</header>

<div class="container">

<div class="box">

  <h2>🚴 My Deliveries</h2>

  <div class="delivery-note">
    Orders yahan se manage karo. Customer ko call kar sakte ho,
    address Google Maps me open kar sakte ho aur delivery complete
    hone par order ko Delivered mark kar sakte ho.
  </div>

  <button class="refresh" onclick="loadOrders()">
    🔄 Refresh Orders
  </button>

</div>

<div class="box">

  <h2>🛒 Orders</h2>

  <div id="orders">
    <div class="loading">
      Loading orders...
    </div>
  </div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://oxfuccrgitckvozmnyss.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DwZtFpmfTwDnlAp6fYbjpA_upTa3khj";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function loadOrders(){

  const container =
    document.getElementById("orders");

  container.innerHTML =
    '<div class="loading">Loading orders...</div>';


  const { data, error } =
    await supabaseClient
      .from("orders")
      .select("*")
      .order("created_at", { ascending:false });


  if(error){

    console.error(error);

    container.innerHTML =
      `<div class="error">
        ❌ Error loading orders:<br>
        ${error.message}
      </div>`;

    return;
  }


  if(!data || data.length === 0){

    container.innerHTML =
      '<div class="empty">No orders yet.</div>';

    return;
  }


  container.innerHTML = "";


  data.forEach(order => {

    const div =
      document.createElement("div");

    div.className = "order";


    const phone =
      String(order.customer_phone || "");

    const address =
      String(order.delivery_address || "");


    const encodedAddress =
      encodeURIComponent(address);


    div.innerHTML = `

      <div class="order-id">
        🛒 Order #${order.id}
      </div>

      <div class="customer">

        <b>👤 ${order.customer_name}</b><br>

        📞 ${phone}<br>

        📍 ${address}

      </div>

      <div class="amount">
        💰 COD: ₹${order.total_amount}
      </div>

      <div class="status">
        ${order.status || "pending"}
      </div>


      <select
        onchange="updateStatus(${order.id}, this.value)"
      >

        <option value="pending"
          ${order.status === "pending" ? "selected" : ""}>
          Pending
        </option>

        <option value="preparing"
          ${order.status === "preparing" ? "selected" : ""}>
          Preparing
        </option>

        <option value="ready"
          ${order.status === "ready" ? "selected" : ""}>
          Ready
        </option>

        <option value="out_for_delivery"
          ${order.status === "out_for_delivery" ? "selected" : ""}>
          Out for Delivery
        </option>

        <option value="delivered"
          ${order.status === "delivered" ? "selected" : ""}>
          Delivered
        </option>

        <option value="cancelled"
          ${order.status === "cancelled" ? "selected" : ""}>
          Cancelled
        </option>

      </select>


      <div class="actions">

        <a
          class="action-btn"
          href="tel:${phone}">
          📞 Call
        </a>


        <a
          class="action-btn"
          href="https://www.google.com/maps/search/?api=1&query=${encodedAddress}"
          target="_blank">
          🗺️ Navigate
        </a>

      </div>


      <button
        class="delivered"
        onclick="markDelivered(${order.id})">

        ✅ Mark Delivered

      </button>

    `;


    container.appendChild(div);

  });

}


async function updateStatus(orderId,newStatus){

  const { error } =
    await supabaseClient
      .from("orders")
      .update({
        status:newStatus
      })
      .eq("id",orderId);


  if(error){

    alert(
      "❌ Status update failed: " +
      error.message
    );

    return;
  }


  loadOrders();

}


async function markDelivered(orderId){

  const confirmDelivery =
    confirm(
      "Kya ye order successfully deliver ho gaya?"
    );


  if(!confirmDelivery){
    return;
  }


  const { error } =
    await supabaseClient
      .from("orders")
      .update({
        status:"delivered"
      })
      .eq("id",orderId);


  if(error){

    alert(
      "❌ Delivery update failed: " +
      error.message
    );

    return;
  }


  alert(
    "✅ Order #" +
    orderId +
    " Delivered!"
  );


  loadOrders();

}


loadOrders();

</script>

</body>
</html>
