<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Ghar Ka Khana - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f5f5f5;
}

.header{
  background:#111;
  color:white;
  padding:20px;
  text-align:center;
}

.container{
  max-width:850px;
  margin:auto;
  padding:15px;
}

.card,.order{
  background:white;
  padding:18px;
  margin:15px 0;
  border-radius:15px;
  box-shadow:0 2px 10px #ddd;
}

input,button{
  width:100%;
  padding:14px;
  margin:7px 0;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:17px;
}

button{
  background:#111;
  color:white;
  border:0;
  font-weight:bold;
}

.green{background:#16833b}
.blue{background:#1769aa}
.red{background:#c62828}

.hidden{display:none}

.item{
  padding:8px 0;
  border-bottom:1px solid #eee;
}

.error{
  color:red;
  font-weight:bold;
}

.success{
  color:green;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="login">

<div class="header">
<h1>🍲 Ghar Ka Khana</h1>
<p>Admin Panel</p>
</div>

<div class="container">

<div class="card">

<h2>🔐 Admin Login</h2>

<input
id="pin"
type="password"
inputmode="numeric"
maxlength="4"
placeholder="Enter 4 Digit PIN">

<button onclick="login()">
Login
</button>

<p id="msg"></p>

</div>

</div>
</div>


<div id="dashboard" class="hidden">

<div class="header">
<h1>🍲 Ghar Ka Khana</h1>
<p>Admin Dashboard</p>
</div>

<div class="container">

<div class="card">

<button onclick="loadOrders()">
🔄 Refresh Orders
</button>

<button class="red" onclick="logout()">
🔒 Logout
</button>

</div>

<div id="orders">
Loading...
</div>

</div>
</div>


<script>

const SUPABASE_URL =
"https://oxfuccrgitckvozmnyss.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DwZtFpmfTwDnlAp6fYbjpA_upTa3khj";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let adminPin = "";


async function login(){

const pin =
document.getElementById("pin").value;

const msg =
document.getElementById("msg");

if(pin.length !== 4){

msg.className="error";
msg.innerText="❌ 4 digit PIN enter karo";
return;

}

msg.innerText="Checking...";

const {data,error} =
await db.rpc(
"admin_login",
{pin:pin}
);

if(error){

console.error(error);

msg.className="error";
msg.innerText="❌ "+error.message;

return;
}

if(data !== true){

msg.className="error";
msg.innerText="❌ Wrong PIN";

return;
}

adminPin=pin;

sessionStorage.setItem(
"admin_pin",
pin
);

document
.getElementById("login")
.classList.add("hidden");

document
.getElementById("dashboard")
.classList.remove("hidden");

loadOrders();

}


async function loadOrders(){

const box =
document.getElementById("orders");

box.innerHTML=
"<div class='card'>⏳ Loading orders...</div>";

const {data,error} =
await db.rpc(
"admin_get_orders",
{pin:adminPin}
);

if(error){

box.innerHTML=
"<div class='card error'>❌ "+
error.message+
"</div>";

return;
}

if(!data || data.length===0){

box.innerHTML=
"<div class='card'>📦 No orders yet.</div>";

return;
}

box.innerHTML="";

data.forEach(order=>{

let items="";

(order.items || []).forEach(item=>{

items += `
<div class="item">
🍽️ ${escapeHTML(item.item_name)}
 × ${item.quantity}
 — ₹${item.price}
</div>
`;

});

const div =
document.createElement("div");

div.className="order";

div.innerHTML=`

<h2>🧾 Order #${order.id}</h2>

<p>👤 <b>${escapeHTML(order.customer_name)}</b></p>

<p>📞 ${escapeHTML(order.customer_phone)}</p>

<p>📍 ${escapeHTML(order.delivery_address)}</p>

<p>💰 <b>₹${order.total_amount}</b></p>

<p>💳 ${escapeHTML(order.payment_method || "COD")}</p>

<p>📌 Status:
<b>${escapeHTML(order.status || "pending")}</b>
</p>

<hr>

<h3>🍽️ Items</h3>

${items || "No item details"}

<br>

<button class="green"
onclick="markDelivered(${order.id})">
✅ Mark Delivered
</button>

<button class="blue"
onclick="callCustomer('${encodeURIComponent(order.customer_phone)}')">
📞 Call Customer
</button>

<button
onclick="navigate('${encodeURIComponent(order.delivery_address)}')">
🗺️ Navigate
</button>

`;

box.appendChild(div);

});

}


async function markDelivered(id){

const {data,error} =
await db.rpc(
"admin_mark_delivered",
{
pin:adminPin,
order_id:id
}
);

if(error){

alert("❌ "+error.message);
return;

}

alert("✅ Order delivered!");

loadOrders();

}


function callCustomer(phone){

window.location.href=
"tel:"+decodeURIComponent(phone);

}


function navigate(address){

window.open(
"https://www.google.com/maps/search/?api=1&query="+
address,
"_blank"
);

}


function logout(){

adminPin="";

sessionStorage.removeItem(
"admin_pin"
);

location.reload();

}


function escapeHTML(value){

if(value===null ||
value===undefined){

return "";

}

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


const savedPin =
sessionStorage.getItem("admin_pin");

if(savedPin){

adminPin=savedPin;

db.rpc(
"admin_login",
{pin:adminPin}
).then(({data})=>{

if(data===true){

document
.getElementById("login")
.classList.add("hidden");

document
.getElementById("dashboard")
.classList.remove("hidden");

loadOrders();

}

});

}

</script>

</body>
</html>
