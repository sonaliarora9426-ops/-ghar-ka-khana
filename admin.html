<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Ghar Ka Khana Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f6f6f6;
color:#222
}

header{
background:#e23744;
color:#fff;
padding:18px;
text-align:center
}

header h1{
margin:0;
font-size:23px
}

.container{
max-width:900px;
margin:auto;
padding:15px
}

.card{
background:#fff;
border-radius:14px;
padding:16px;
margin-bottom:15px;
box-shadow:0 2px 8px #00000012
}

.login{
max-width:400px;
margin:60px auto
}

input,select,textarea{
width:100%;
padding:12px;
margin:6px 0;
border:1px solid #ddd;
border-radius:9px;
font-size:15px
}

button{
border:0;
border-radius:8px;
padding:10px 14px;
font-size:14px
}

.primary{
background:#e23744;
color:#fff
}

.green{
background:#168a45;
color:#fff
}

.gray{
background:#eee
}

.red{
background:#d62828;
color:#fff
}

.nav{
display:flex;
gap:7px;
overflow-x:auto;
margin-bottom:15px
}

.nav button{
background:#fff;
white-space:nowrap;
border:1px solid #ddd
}

.nav button.active{
background:#e23744;
color:#fff
}

.section{
display:none
}

.section.active{
display:block
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.order{
border:1px solid #eee;
border-radius:12px;
padding:14px;
margin-bottom:12px
}

.order h3{
margin:0 0 7px
}

.status{
display:inline-block;
background:#fff1c7;
padding:5px 9px;
border-radius:20px;
font-size:12px
}

.order-item{
display:flex;
justify-content:space-between;
padding:9px 0;
border-bottom:1px solid #eee
}

.item-desc{
font-size:12px;
color:#777;
margin-top:3px
}

.total{
font-size:18px;
font-weight:bold;
text-align:right;
margin-top:10px
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.stat{
font-size:25px;
font-weight:bold
}

.menu-row{
display:flex;
justify-content:space-between;
gap:10px;
padding:13px 0;
border-bottom:1px solid #eee
}

.menu-info{
flex:1
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
align-items:center;
justify-content:center;
padding:15px
}

.modal-box{
background:#fff;
padding:18px;
border-radius:15px;
width:100%;
max-width:480px
}

@media(max-width:600px){
.menu-row{
flex-direction:column
}
}
</style>
</head>

<body>

<header>
<h1>🍱 Ghar Ka Khana</h1>
<div>Restaurant Partner</div>
</header>


<!-- LOGIN -->

<div id="loginPage" class="container">

<div class="card login">

<h2>Admin Login</h2>

<input
id="pin"
type="password"
inputmode="numeric"
maxlength="4"
placeholder="Enter PIN"
>

<button
class="primary"
style="width:100%"
onclick="login()"
>
Login
</button>

</div>
</div>


<!-- APP -->

<div id="app" class="container" style="display:none">

<div class="card top">

<div>
<b>Ghar Ka Khana</b>
<div style="font-size:12px;color:#777">
Restaurant Dashboard
</div>
</div>

<button class="red" onclick="logout()">
Logout
</button>

</div>


<!-- NAV -->

<div class="nav">

<button
class="active"
onclick="show('orders',this)"
>
Orders
</button>

<button onclick="show('hub',this)">
Hub
</button>

<button onclick="show('growth',this)">
Growth
</button>

<button onclick="show('menu',this)">
Menu
</button>

<button onclick="show('finance',this)">
Finance
</button>

</div>


<!-- ORDERS -->

<div id="orders" class="section active">

<div class="card">

<div class="top">

<h2>📦 Orders</h2>

<button
class="gray"
onclick="loadOrders()"
>
Refresh
</button>

</div>

<div id="ordersList">
Loading...
</div>

</div>
</div>


<!-- HUB -->

<div id="hub" class="section">

<div class="card">

<h2>🏠 Hub</h2>

<div class="grid">

<div class="card">
<div style="font-size:12px;color:#777">
Today's Orders
</div>
<div id="todayOrders" class="stat">
0
</div>
</div>

<div class="card">
<div style="font-size:12px;color:#777">
Today's Sales
</div>
<div id="todaySales" class="stat">
₹0
</div>
</div>

<div class="card">
<div style="font-size:12px;color:#777">
Pending
</div>
<div id="pending" class="stat">
0
</div>
</div>

<div class="card">
<div style="font-size:12px;color:#777">
Menu Items
</div>
<div id="menuCount" class="stat">
0
</div>
</div>

</div>
</div>
</div>


<!-- GROWTH -->

<div id="growth" class="section">

<div class="card">

<h2>📈 Growth</h2>

<div class="grid">

<div class="card">
<div>Total Orders</div>
<div id="growthOrders" class="stat">0</div>
</div>

<div class="card">
<div>Total Sales</div>
<div id="growthSales" class="stat">₹0</div>
</div>

</div>

</div>
</div>


<!-- MENU -->

<div id="menu" class="section">

<div class="card">

<div class="top">

<h2>🍽️ Menu</h2>

<button
class="primary"
onclick="openAdd()"
>
+ Add Item
</button>

</div>

<div id="menuList">
Loading...
</div>

</div>
</div>


<!-- FINANCE -->

<div id="finance" class="section">

<div class="card">

<h2>💰 Finance</h2>

<div class="grid">

<div class="card">
<div>Total Orders</div>
<div id="financeOrders" class="stat">
0
</div>
</div>

<div class="card">
<div>Total Sales</div>
<div id="financeSales" class="stat">
₹0
</div>
</div>

</div>

</div>
</div>

</div>


<!-- MENU MODAL -->

<div id="modal" class="modal">

<div class="modal-box">

<div class="top">

<h2 id="modalTitle">
Add Menu Item
</h2>

<button
class="gray"
onclick="closeModal()"
>
✕
</button>

</div>

<input
type="hidden"
id="menuId"
>

<input
id="menuName"
placeholder="Item Name"
>

<input
id="menuPrice"
type="number"
placeholder="Price"
>

<select id="menuCategory">

<option>Main Course</option>
<option>Parathas & Roti</option>
<option>Snacks</option>
<option>Chaat</option>
<option>Drinks</option>
<option>Combos</option>

</select>

<textarea
id="menuDescription"
placeholder="Description"
></textarea>

<button
class="primary"
style="width:100%"
onclick="saveMenu()"
>
Save
</button>

</div>
</div>


<script>

const URL=
"https://oxfuccrgitckvozmnyss.supabase.co";

const KEY=
"sb_publishable_DwZtFpmfTwDnlAp6fYbjpA_upTa3khj";

const db=
supabase.createClient(URL,KEY);

const PIN="7869";

let orders=[];
let menuItems=[];


/* LOGIN */

function login(){

const pin=
document.getElementById("pin").value.trim();

if(pin!=="7869"){
alert("Wrong PIN");
return;
}

localStorage.setItem(
"gharAdminLoggedIn",
"true"
);

document.getElementById(
"loginPage"
).style.display="none";

document.getElementById(
"app"
).style.display="block";

loadAll();

}


/* AUTO LOGIN */

window.onload=function(){

if(
localStorage.getItem(
"gharAdminLoggedIn"
)==="true"
){

document.getElementById(
"loginPage"
).style.display="none";

document.getElementById(
"app"
).style.display="block";

loadAll();

}

};


/* LOGOUT */

function logout(){

localStorage.removeItem(
"gharAdminLoggedIn"
);

location.reload();

}


/* NAV */

function show(id,btn){

document
.querySelectorAll(".section")
.forEach(x=>x.classList.remove("active"));

document
.querySelectorAll(".nav button")
.forEach(x=>x.classList.remove("active"));

document
.getElementById(id)
.classList.add("active");

btn.classList.add("active");

}


/* LOAD */

async function loadAll(){

await loadOrders();

await loadMenu();

}


/* ORDERS */

async function loadOrders(){

const box=
document.getElementById("ordersList");

box.innerHTML="Loading orders...";

const r=
await db.rpc(
"admin_get_orders",
{pin:PIN}
);

if(r.error){

box.innerHTML=
"<p style='color:red'>"+
r.error.message+
"</p>";

return;
}

orders=r.data||[];

renderOrders();

updateStats();

}


/* RENDER ORDERS */

function renderOrders(){

const box=
document.getElementById("ordersList");

if(!orders.length){

box.innerHTML=
"<p>No orders yet.</p>";

return;
}

box.innerHTML=
orders.map(o=>`

<div class="order">

<h3>Order #${o.id}</h3>

<span class="status">
${safe(o.status||"pending")}
</span>

<p>
<b>Customer:</b>
${safe(o.customer_name)}
</p>

<p>
<b>Phone:</b>
${safe(o.customer_phone)}
</p>

<p>
<b>Address:</b>
${safe(o.delivery_address)}
</p>

<div id="items-${o.id}">
Loading item details...
</div>

<div class="total">
Total: ₹${Number(
o.total_amount||0
).toFixed(0)}
</div>

<br>

<button
class="green"
onclick="delivered(${o.id})"
>
✓ Delivered
</button>

<button
class="gray"
onclick="status(${o.id},'preparing')"
>
Preparing
</button>

<button
class="gray"
onclick="status(${o.id},'ready')"
>
Ready
</button>

<button
class="red"
onclick="status(${o.id},'cancelled')"
>
Cancel
</button>

</div>

`).join("");

orders.forEach(
o=>loadItems(o.id)
);

}


/* ITEM DETAILS */

async function loadItems(orderId){

const box=
document.getElementById(
"items-"+orderId
);

const r=
await db.rpc(
"admin_get_order_items",
{
pin:PIN,
p_order_id:orderId
}
);

if(r.error){

box.innerHTML=
"<p style='color:#d00;font-size:13px'>"+
"Item details error: "+
safe(r.error.message)+
"</p>";

return;
}

let items=r.data||[];

if(typeof items==="string"){

try{
items=JSON.parse(items);
}catch(e){
items=[];
}

}

if(!items.length){

box.innerHTML=
"<p style='font-size:13px;color:#777'>"+
"No item details"+
"</p>";

return;
}

box.innerHTML=
items.map(item=>`

<div class="order-item">

<div>

<b>
${safe(item.item_name)}
</b>

<div class="item-desc">

Qty: ${item.quantity}

${
item.description
?
"<br>"+safe(item.description)
:
""
}

</div>

</div>

<div>
₹${(
Number(item.price||0)*
Number(item.quantity||1)
).toFixed(0)}
</div>

</div>

`).join("");

}


/* DELIVERED */

async function delivered(id){

if(!confirm(
"Mark order as delivered?"
))return;

const r=
await db.rpc(
"admin_mark_delivered",
{
pin:PIN,
order_id:id
}
);

if(r.error){
alert(r.error.message);
return;
}

loadOrders();

}


/* STATUS */

async function status(id,s){

const r=
await db.rpc(
"admin_update_order_status",
{
pin:PIN,
p_order_id:id,
p_status:s
}
);

if(r.error){
alert(r.error.message);
return;
}

loadOrders();

}


/* STATS */

function updateStats(){

const today=
new Date().toDateString();

const todayOrders=
orders.filter(
o=>
new Date(
o.created_at
).toDateString()===today
);

const todaySales=
todayOrders.reduce(
(a,o)=>
a+Number(o.total_amount||0),
0
);

const totalSales=
orders.reduce(
(a,o)=>
a+Number(o.total_amount||0),
0
);

const pending=
orders.filter(
o=>
o.status!=="delivered" &&
o.status!=="cancelled"
).length;

document.getElementById(
"todayOrders"
).innerText=
todayOrders.length;

document.getElementById(
"todaySales"
).innerText=
"₹"+todaySales;

document.getElementById(
"pending"
).innerText=
pending;

document.getElementById(
"growthOrders"
).innerText=
orders.length;

document.getElementById(
"growthSales"
).innerText=
"₹"+totalSales;

document.getElementById(
"financeOrders"
).innerText=
orders.length;

document.getElementById(
"financeSales"
).innerText=
"₹"+totalSales;

document.getElementById(
"menuCount"
).innerText=
menuItems.length;

}


/* MENU */

async function loadMenu(){

const r=
await db.rpc(
"admin_get_menu",
{pin:PIN}
);

if(r.error){

document.getElementById(
"menuList"
).innerHTML=
"<p style='color:red'>"+
r.error.message+
"</p>";

return;
}

menuItems=r.data||[];

renderMenu();

}


/* RENDER MENU */

function renderMenu(){

const box=
document.getElementById(
"menuList"
);

if(!menuItems.length){

box.innerHTML=
"<p>No menu items.</p>";

return;
}

box.innerHTML=
menuItems.map(item=>`

<div class="menu-row">

<div class="menu-info">

<b>
${safe(item.name)}
</b>

<div>
₹${Number(item.price)}
</div>

<div style="font-size:12px;color:#777">
${safe(item.category||"")}
</div>

<div style="font-size:12px;color:#777">
${safe(item.description||"")}
</div>

<div style="font-size:12px">
${
item.is_available
?"🟢 Available"
:"🔴 Unavailable"
}
</div>

</div>

<div>

<button
class="gray"
onclick="editMenu(${item.id})"
>
Edit
</button>

<button
class="gray"
onclick="toggleMenu(${item.id},${item.is_available})"
>
${item.is_available?"Off":"On"}
</button>

<button
class="red"
onclick="deleteMenu(${item.id})"
>
Delete
</button>

</div>

</div>

`).join("");

}


/* ADD */

function openAdd(){

document.getElementById(
"modalTitle"
).innerText="Add Menu Item";

document.getElementById(
"menuId"
).value="";

document.getElementById(
"menuName"
).value="";

document.getElementById(
"menuPrice"
).value="";

document.getElementById(
"menuCategory"
).value="Main Course";

document.getElementById(
"menuDescription"
).value="";

document.getElementById(
"modal"
).style.display="flex";

}


/* EDIT */

function editMenu(id){

const item=
menuItems.find(
x=>Number(x.id)===Number(id)
);

if(!item)return;

document.getElementById(
"modalTitle"
).innerText="Edit Menu Item";

document.getElementById(
"menuId"
).value=item.id;

document.getElementById(
"menuName"
).value=item.name;

document.getElementById(
"menuPrice"
).value=item.price;

document.getElementById(
"menuCategory"
).value=item.category;

document.getElementById(
"menuDescription"
).value=
item.description||"";

document.getElementById(
"modal"
).style.display="flex";

}


/* CLOSE */

function closeModal(){

document.getElementById(
"modal"
).style.display="none";

}


/* SAVE */

async function saveMenu(){

const id=
document.getElementById(
"menuId"
).value;

const name=
document.getElementById(
"menuName"
).value.trim();

const price=
Number(
document.getElementById(
"menuPrice"
).value
);

const category=
document.getElementById(
"menuCategory"
).value;

const description=
document.getElementById(
"menuDescription"
).value.trim();

if(!name||!price){

alert("Enter name and price");

return;
}

let r;

if(id){

r=
await db.rpc(
"admin_update_menu_item",
{
pin:PIN,
p_id:Number(id),
p_name:name,
p_price:price,
p_category:category,
p_description:description
}
);

}else{

r=
await db.rpc(
"admin_add_menu_item",
{
pin:PIN,
p_name:name,
p_price:price,
p_category:category,
p_description:description,
p_is_available:true
}
);

}

if(r.error){

alert(r.error.message);

return;
}

closeModal();

loadMenu();

}


/* TOGGLE */

async function toggleMenu(id,current){

const r=
await db.rpc(
"admin_toggle_menu_item",
{
pin:PIN,
p_id:id,
p_is_available:!current
}
);

if(r.error){
alert(r.error.message);
return;
}

loadMenu();

}


/* DELETE */

async function deleteMenu(id){

if(!confirm(
"Delete this item?"
))return;

const r=
await db.rpc(
"admin_delete_menu_item",
{
pin:PIN,
p_id:id
}
);

if(r.error){
alert(r.error.message);
return;
}

loadMenu();

}


/* SAFE TEXT */

function safe(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
