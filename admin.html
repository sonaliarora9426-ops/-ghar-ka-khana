<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ghar Ka Khana - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

.header{
  background:#111;
  color:white;
  padding:20px;
  text-align:center;
}

.container{
  max-width:850px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:20px;
  margin:15px 0;
  border-radius:15px;
  box-shadow:0 2px 10px #ddd;
}

input,button,select{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
}

button{
  background:#111;
  color:white;
  border:0;
  font-weight:bold;
}

.green{background:#16833b}
.blue{background:#1769aa}
.red{background:#c62828}
.gray{background:#555}

.order{
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
  margin:12px 0;
  background:#fff;
}

.item{
  padding:7px 0;
  border-bottom:1px solid #eee;
}

.error{
  color:#d00;
  font-weight:bold;
}

.success{
  color:green;
  font-weight:bold;
}

.hidden{
  display:none;
}

.small{
  color:#666;
  font-size:13px;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

  <div class="header">
    <h1>🍲 Ghar Ka Khana</h1>
    <p>Admin Login</p>
  </div>

  <div class="container">

    <div class="card">

      <h2>🔐 Login</h2>

      <input
        type="email"
        id="email"
        value="sonaliarora9426@gmail.com"
        placeholder="Admin Email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button onclick="login()">
        Login
      </button>

      <p id="loginMessage"></p>

    </div>

  </div>

</div>


<!-- ADMIN PANEL -->

<div id="adminScreen" class="hidden">

  <div class="header">
    <h1>🍲 Ghar Ka Khana</h1>
    <p>Admin Dashboard</p>
  </div>

  <div class="container">

    <div class="card">

      <button onclick="loadOrders()">
        🔄 Refresh Orders
      </button>

      <button class="gray" onclick="logout()">
        🔒 Logout
      </button>

    </div>


    <div class="card">

      <h2>📦 Orders</h2>

      <div id="orders">
        Loading...
      </div>

    </div>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://oxfuccrgitckvozmnyss.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DwZtFpmfTwDnlAp6fYbjpA_upTa3khj";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   START
========================= */

checkLogin();


/* =========================
   CHECK LOGIN
========================= */

async function checkLogin(){

  const {
    data,
    error
  } = await supabaseClient.auth.getSession();

  if(error){

    showLogin();

    return;

  }

  if(data.session){

    const user =
      data.session.user;

    const {
      data:profile,
      error:profileError
    } = await supabaseClient
      .from("profiles")
      .select("role,name")
      .eq("id",user.id)
      .single();

    if(
      !profileError &&
      profile &&
      profile.role === "admin"
    ){

      showAdmin();

    }else{

      await supabaseClient.auth.signOut();

      showLogin();

      document.getElementById(
        "loginMessage"
      ).innerText =
        "❌ This account is not an admin.";

    }

  }else{

    showLogin();

  }

}


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.className="";
  message.innerText="Logging in...";

  const {
    data,
    error
  } = await supabaseClient.auth
    .signInWithPassword({
      email:email,
      password:password
    });

  if(error){

    message.className="error";

    message.innerText =
      "❌ " + error.message;

    return;

  }

  const user =
    data.user;

  const {
    data:profile,
    error:profileError
  } = await supabaseClient
    .from("profiles")
    .select("role,name")
    .eq("id",user.id)
    .single();

  if(
    profileError ||
    !profile ||
    profile.role !== "admin"
  ){

    await supabaseClient.auth.signOut();

    message.className="error";

    message.innerText =
      "❌ Admin profile/role not found.";

    return;

  }

  showAdmin();

}


/* =========================
   SHOW ADMIN
========================= */

function showAdmin(){

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("adminScreen")
    .classList.remove("hidden");

  loadOrders();

}


/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

  document
    .getElementById("adminScreen")
    .classList.add("hidden");

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

  const box =
    document.getElementById("orders");

  box.innerHTML =
    "⏳ Loading orders...";


  const {
    data:orders,
    error
  } = await supabaseClient
    .from("orders")
    .select("*")
    .order("created_at",{ascending:false});


  if(error){

    console.error(error);

    box.innerHTML = `
      <p class="error">
        ❌ Orders load nahi ho rahe.
      </p>
      <p class="small">
        ${error.message}
      </p>
    `;

    return;

  }


  if(!orders || orders.length === 0){

    box.innerHTML =
      "<p>No orders yet.</p>";

    return;

  }


  box.innerHTML="";


  for(const order of orders){

    const div =
      document.createElement("div");

    div.className="order";


    div.innerHTML = `

      <h3>🧾 Order #${order.id}</h3>

      <p>
        👤 <b>${escapeHTML(order.customer_name)}</b>
      </p>

      <p>
        📞 ${escapeHTML(order.customer_phone)}
      </p>

      <p>
        📍 ${escapeHTML(order.delivery_address)}
      </p>

      <p>
        💰 <b>₹${order.total_amount}</b>
      </p>

      <p>
        💳 ${escapeHTML(
          order.payment_method || "COD"
        )}
      </p>

      <p>
        📌 Status:
        <b>${escapeHTML(
          order.status || "pending"
        )}</b>
      </p>

      <hr>

      <b>🍽️ Order Items</b>

      <div id="items-${order.id}">
        Loading items...
      </div>

      <button
        class="green"
        onclick="markDelivered(${order.id})">
        ✅ Mark Delivered
      </button>

      <button
        class="blue"
        onclick="callCustomer('${encodeURIComponent(order.customer_phone)}')">
        📞 Call Customer
      </button>

      <button
        onclick="navigate('${encodeURIComponent(order.delivery_address)}')">
        🗺️ Navigate
      </button>

    `;


    box.appendChild(div);

    loadItems(order.id);

  }

}


/* =========================
   LOAD ORDER ITEMS
========================= */

async function loadItems(orderId){

  const box =
    document.getElementById(
      "items-" + orderId
    );


  const {
    data:items,
    error
  } = await supabaseClient
    .from("order_items")
    .select("*")
    .eq("order_id",orderId);


  if(error){

    box.innerHTML =
      "<p>Items unavailable.</p>";

    return;

  }


  if(!items || items.length === 0){

    box.innerHTML =
      "<p>No item details.</p>";

    return;

  }


  box.innerHTML="";


  items.forEach(item=>{

    const div =
      document.createElement("div");

    div.className="item";

    div.innerHTML = `
      ${escapeHTML(item.item_name || "Item")}
      × ${item.quantity || 1}
      — ₹${item.price || 0}
    `;

    box.appendChild(div);

  });

}


/* =========================
   MARK DELIVERED
========================= */

async function markDelivered(id){

  const {
    error
  } = await supabaseClient
    .from("orders")
    .update({
      status:"delivered"
    })
    .eq("id",id);


  if(error){

    alert(
      "❌ " + error.message
    );

    return;

  }


  alert(
    "✅ Order marked as delivered!"
  );

  loadOrders();

}


/* =========================
   CALL
========================= */

function callCustomer(phone){

  window.location.href =
    "tel:" +
    decodeURIComponent(phone);

}


/* =========================
   MAPS
========================= */

function navigate(address){

  window.open(
    "https://www.google.com/maps/search/?api=1&query=" +
    address,
    "_blank"
  );

}


/* =========================
   HTML SECURITY
========================= */

function escapeHTML(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
