<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ghar Ka Khana - Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f6f6f6;
  color:#222;
}

.header{
  background:#111;
  color:white;
  padding:18px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:25px;
}

.header p{
  margin:6px 0 0;
}

.container{
  max-width:800px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  margin-bottom:15px;
  border-radius:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

input,select,button{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:9px;
  border:1px solid #ccc;
  font-size:15px;
}

button{
  background:#111;
  color:white;
  border:none;
  font-weight:bold;
}

button.green{
  background:#16833b;
}

button.red{
  background:#c62828;
}

button.blue{
  background:#1769aa;
}

.order{
  border:1px solid #ddd;
  padding:15px;
  margin:12px 0;
  border-radius:12px;
}

.order h3{
  margin-top:0;
}

.item{
  padding:6px 0;
  border-bottom:1px solid #eee;
}

.hidden{
  display:none;
}

.error{
  color:#d00;
  text-align:center;
  font-weight:bold;
}

.success{
  color:green;
  text-align:center;
  font-weight:bold;
}

.total{
  font-size:19px;
  font-weight:bold;
}

.logout{
  background:#555;
}

.small{
  font-size:13px;
  color:#666;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

  <div class="header">
    <h1>🍲 Ghar Ka Khana</h1>
    <p>Admin Panel</p>
  </div>

  <div class="container">

    <div class="card">

      <h2>🔐 Admin Login</h2>

      <p class="small">
        Enter your 4 digit admin PIN
      </p>

      <input
        id="pin"
        type="password"
        inputmode="numeric"
        maxlength="4"
        placeholder="Enter PIN"
      >

      <button onclick="login()">
        Login
      </button>

      <p id="loginError" class="error"></p>

    </div>

  </div>

</div>


<!-- ADMIN PANEL -->

<div id="adminScreen" class="hidden">

  <div class="header">

    <h1>🍲 Ghar Ka Khana</h1>

    <p>Admin Dashboard</p>

  </div>

  <div class="container">

    <div class="card">

      <button onclick="loadOrders()">
        🔄 Refresh Orders
      </button>

      <button class="logout" onclick="logout()">
        🔒 Logout
      </button>

    </div>


    <div class="card">

      <h2>📦 Orders</h2>

      <div id="orders">
        Loading orders...
      </div>

    </div>

  </div>

</div>


<script>

/* ======================================
   ADMIN PIN
   ====================================== */

const ADMIN_PIN = "7869";


/* ======================================
   SUPABASE
   ====================================== */

const SUPABASE_URL =
"https://oxfuccrgitckvozmnyss.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DwZtFpmfTwDnlAp6fYbjpA_upTa3khj";


/* ======================================
   LOGIN
   ====================================== */

function login(){

  const pin =
    document.getElementById("pin").value;

  if(pin === ADMIN_PIN){

    localStorage.setItem(
      "ghar_ka_khana_admin",
      "true"
    );

    showAdmin();

  }else{

    document.getElementById("loginError")
      .innerText =
      "❌ Wrong PIN";

  }

}


/* ======================================
   SHOW ADMIN
   ====================================== */

function showAdmin(){

  document.getElementById("loginScreen")
    .classList.add("hidden");

  document.getElementById("adminScreen")
    .classList.remove("hidden");

  loadOrders();

}


/* ======================================
   LOGOUT
   ====================================== */

function logout(){

  localStorage.removeItem(
    "ghar_ka_khana_admin"
  );

  location.reload();

}


/* ======================================
   CHECK LOGIN
   ====================================== */

if(
  localStorage.getItem(
    "ghar_ka_khana_admin"
  ) === "true"
){

  showAdmin();

}


/* ======================================
   LOAD ORDERS
   ====================================== */

async function loadOrders(){

  const box =
    document.getElementById("orders");

  box.innerHTML =
    "⏳ Loading orders...";


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/orders" +
        "?select=*" +
        "&order=created_at.desc",
        {
          method:"GET",

          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          }
        }
      );


    if(!response.ok){

      throw new Error(
        "Orders access denied"
      );

    }


    const orders =
      await response.json();


    if(!orders.length){

      box.innerHTML =
        "<p>No orders yet.</p>";

      return;

    }


    box.innerHTML = "";


    for(const order of orders){

      const div =
        document.createElement("div");

      div.className = "order";


      let itemsHTML =
        "<p>Loading items...</p>";


      div.innerHTML = `

        <h3>
          🧾 Order #${order.id}
        </h3>

        <p>
          <b>👤 Customer:</b>
          ${escapeHTML(order.customer_name)}
        </p>

        <p>
          <b>📞 Phone:</b>
          ${escapeHTML(order.customer_phone)}
        </p>

        <p>
          <b>📍 Address:</b>
          ${escapeHTML(order.delivery_address)}
        </p>

        <p>
          <b>💳 Payment:</b>
          ${escapeHTML(
            order.payment_method || "COD"
          )}
        </p>

        <p>
          <b>💰 Total:</b>
          ₹${order.total_amount}
        </p>

        <p>
          <b>📌 Status:</b>
          ${escapeHTML(
            order.status || "pending"
          )}
        </p>

        <hr>

        <b>🍽️ Items</b>

        <div id="items-${order.id}">
          ${itemsHTML}
        </div>

        <br>

        <button
          class="green"
          onclick="markDelivered(${order.id})">

          ✅ Mark Delivered

        </button>


        <button
          class="blue"
          onclick="callCustomer('${encodeURIComponent(order.customer_phone)}')">

          📞 Call Customer

        </button>


        <button
          onclick="navigate('${encodeURIComponent(order.delivery_address)}')">

          🗺️ Navigate

        </button>

      `;


      box.appendChild(div);


      loadOrderItems(order.id);

    }


  }catch(error){

    console.error(error);

    box.innerHTML = `

      <p class="error">
        ❌ Orders load nahi ho rahe.
      </p>

      <p class="small">
        Supabase RLS/Admin authorization
        check karni hogi.
      </p>

    `;

  }

}


/* ======================================
   LOAD ORDER ITEMS
   ====================================== */

async function loadOrderItems(orderId){

  const box =
    document.getElementById(
      "items-" + orderId
    );

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/order_items" +
        "?order_id=eq." +
        orderId +
        "&select=*",
        {
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          }
        }
      );


    if(!response.ok){

      box.innerHTML =
        "<p>Items unavailable</p>";

      return;

    }


    const items =
      await response.json();


    if(!items.length){

      box.innerHTML =
        "<p>No item details.</p>";

      return;

    }


    box.innerHTML = "";


    items.forEach(item=>{

      const div =
        document.createElement("div");

      div.className = "item";


      div.innerHTML = `

        ${escapeHTML(
          item.item_name || "Item"
        )}

        × ${item.quantity || 1}

        — ₹${item.price || 0}

      `;


      box.appendChild(div);

    });


  }catch(error){

    box.innerHTML =
      "<p>Items unavailable.</p>";

  }

}


/* ======================================
   MARK DELIVERED
   ====================================== */

async function markDelivered(id){

  if(
    !confirm(
      "Mark this order as delivered?"
    )
  ){

    return;

  }


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/orders?id=eq." +
        id,
        {
          method:"PATCH",

          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"
          },

          body:JSON.stringify({
            status:"delivered"
          })
        }
      );


    if(!response.ok){

      alert(
        "❌ Status update nahi hua."
      );

      return;

    }


    alert(
      "✅ Order delivered!"
    );


    loadOrders();


  }catch(error){

    alert(
      "❌ Something went wrong."
    );

  }

}


/* ======================================
   CALL CUSTOMER
   ====================================== */

function callCustomer(phone){

  window.location.href =
    "tel:" +
    decodeURIComponent(phone);

}


/* ======================================
   GOOGLE MAPS
   ====================================== */

function navigate(address){

  const url =
    "https://www.google.com/maps/search/?api=1&query=" +
    address;

  window.open(
    url,
    "_blank"
  );

}


/* ======================================
   SECURITY HELPER
   ====================================== */

function escapeHTML(value){

  if(value === null ||
     value === undefined){

    return "";

  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
